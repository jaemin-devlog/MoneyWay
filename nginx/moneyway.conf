# 업그레이드 연결 헤더 맵
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 80 → 443 리다이렉트 (리다이렉트 경로에서도 본문 한도를 검사하므로 여기에도 명시)
server {
    listen 80;
    server_name moneyway.cloud www.moneyway.cloud;

    client_max_body_size 150m;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / {
        client_max_body_size 150m;
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl http2;
    server_name moneyway.cloud www.moneyway.cloud;

    # TLS
    ssl_certificate     /etc/letsencrypt/live/moneyway.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/moneyway.cloud/privkey.pem;

    # 업로드 한도 & 타임아웃
    client_max_body_size 150m;
    proxy_read_timeout   120s;
    proxy_send_timeout   120s;

    # 정적 업로드 파일: Nginx가 직접 서빙 (/uploads/** → /var/app/uploads/)
    location /uploads/ {
        alias /var/app/uploads/;
        autoindex off;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    # 애플리케이션 프록시
    location / {
        client_max_body_size 150m;

        proxy_pass http://127.0.0.1:8081;   # 앱이 8080에서 뜬다면 8080으로 바꿔

        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;

        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         $connection_upgrade;

        proxy_buffering off;   # SSE/스트리밍에 유용. 필요 없으면 제거 가능.
        proxy_redirect off;
    }
}
